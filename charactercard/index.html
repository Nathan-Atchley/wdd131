<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Cards - Combat</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Cards - Combat">
    <meta property="og:description" content="A dynamic Pathfinder character card built with HTML, CSS, and JavaScript.">
    <meta property="og:url" content="https://nathan-atchley.github.io/wdd131/charactercard/">
    <meta property="og:image" content="images/preview1200x630.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Cards - Combat">
    <meta name="twitter:description" content="A dynamic Pathfinder character card built with HTML, CSS, and JavaScript.">
    <meta name="twitter:image" content="images/preview1200x630.png">

    <link rel="icon" href="images/d20.ico">
    <link rel="apple-touch-icon" href="images/applepreview180x180.png">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main>
        <div class="card">
            <img id="char-image" class="image" src="" alt="Character Image">
            
            <h2 id="char-name" class="name"></h2>
            
            <div class="stats">
                <p>Class: <span id="char-class"></span></p>
                <p>Level: <span id="char-level"></span></p>
                <p>Health: <span id="char-hp"></span> / <span id="char-maxhp"></span></p>
            </div>
            
            <div class="buttons">
                <button id="btn-attack">Attack</button>
                <button id="btn-heal">Heal Self</button>
                <button id="btn-level">Level Up</button>
            </div>
        </div>
        <div class="card">
            <img id="enemy-image" class="image" src="" alt="Character Image">
            
            <h2 id="enemy-name" class="name"></h2>
            
            <div class="stats">
                <p>Class: <span id="enemy-class"></span></p>
                <p>Level: <span id="enemy-level"></span></p>
                <p>Health: <span id="enemy-hp"></span> / <span id="enemy-maxhp"></span></p>
            </div>
            
            <div class="buttons">
                <button id="btn-attack2">Attack</button>
                <button id="btn-heal2">Heal Self</button>
                <button id="btn-level2">Level Up</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
